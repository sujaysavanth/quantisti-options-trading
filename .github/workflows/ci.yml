name: CI

# Every job is blocking: a failing test, lint error, type error or broken Dockerfile turns the run red.
# To stop red code reaching main, require these checks in GitHub: Settings -> Branches -> main.

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch cancels the run still going for the older one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: Python tests (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false            # show every failing service, not just the first
      matrix:
        # Services with tests. gateway, portfolio, stats and explain are health-only stubs (built below).
        service: [market, simulator, ml, ingest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/${{ matrix.service }}/pyproject.toml
      - name: Install
        working-directory: services/${{ matrix.service }}
        run: pip install -e ".[test]"
      - name: Test
        working-directory: services/${{ matrix.service }}
        run: pytest -q

  spark-tests:
    name: Spark tests (stream-processing)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: quantisti
          POSTGRES_PASSWORD: quantisti
          POSTGRES_DB: quantisti
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U quantisti" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://quantisti:quantisti@localhost:5432/quantisti
    steps:
      - uses: actions/checkout@v4
      - name: Apply schema
        run: |
          for f in schema/sql/*.sql; do
            echo "applying $f"
            psql "$DATABASE_URL" -q -v ON_ERROR_STOP=1 -f "$f"
          done
      - uses: docker/setup-buildx-action@v3
      - name: Build the Spark image
        uses: docker/build-push-action@v6
        with:
          context: services/stream-processing
          tags: quantisti-spark:ci
          load: true
          cache-from: type=gha,scope=stream-processing
          cache-to: type=gha,scope=stream-processing,mode=max
      - name: Test
        # --network host: the container reaches the Postgres service on localhost.
        # REQUIRE_POSTGRES makes the sink tests fail instead of skipping if the database isn't there.
        run: >-
          docker run --rm --network host -e DATABASE_URL -e REQUIRE_POSTGRES=1
          quantisti-spark:ci pytest -q

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff==0.16.10
      - run: ruff check services scripts      # rules in ruff.toml

  frontend:
    name: Frontend build (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [landing, services/strategy-dashboard]
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json
      - name: Install
        working-directory: ${{ matrix.app }}
        run: npm ci
      - name: Unit tests
        working-directory: ${{ matrix.app }}
        run: npm test --if-present
      - name: Build (includes the TypeScript type check)
        working-directory: ${{ matrix.app }}
        run: npm run build

  docker-build:
    name: Docker build (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [gateway, market, simulator, portfolio, stats, ml, explain, market-stream, ingest, stream-processing]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: services/${{ matrix.service }}
          push: false
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max
