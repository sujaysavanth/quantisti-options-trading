[project]
name = "ml"
version = "0.1.0"
description = "Machine learning and feature engineering service for the Quantisti options trading platform"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "pydantic-settings",
    "psycopg2-binary",
    "pandas",
    "numpy",
    "httpx",
    "python-dateutil",
    "exchange_calendars>=4.5",
    "arch>=7.0",                 # GARCH baseline (app/evaluation/baselines.py)
    "scikit-learn>=1.4",         # ridge and gradient-boosted models (app/forecasting/)
    "interpret-core>=0.6",       # explainable boosting machine (EBM)
    "mlflow>=3.0",               # experiment tracking + model registry, SQLite backend (app/tracking.py, registry.py)
]

[project.optional-dependencies]
test = ["pytest>=8.0"]
# Research contenders, local only (not in the service image or CI): torch + Chronos-2 (~120M parameters).
research = ["chronos-forecasting>=2.0", "torch>=2.2"]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]
